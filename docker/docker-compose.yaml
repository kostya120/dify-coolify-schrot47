services:
  # Init container to fix permissions
  init_permissions:
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        FLAG_FILE="/app/api/storage/.init_permissions"
        if [ -f "$${FLAG_FILE}" ]; then
          echo "Permissions already initialized. Exiting."
          exit 0
        fi
        echo "Initializing permissions for /app/api/storage"
        chown -R 1001:1001 /app/api/storage && touch "$${FLAG_FILE}"
        echo "Permissions initialized. Exiting."
    volumes:
      - ./docker/volumes/app/storage:/app/api/storage
    restart: "no"

  # API service
  api:
    <<: *shared-api-config
    image: langgenius/dify-api:1.19.0
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MODE: api
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
      # Mount the storage directory to the container, for storing user files.
      - ./docker/volumes/app/storage:/app/api/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - ssrf_proxy_network
      - default

  # WebSocket service for workflow collaboration.
  api_websocket:
    <<: *shared-api-config
    image: langgenius/dify-api:1.19.0
    profiles:
      - collaboration
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MODE: api
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-}
    # Resolve websocket settings after loading the shared/API service files.
    entrypoint:
      - /bin/bash
      - -c
      - |
        export SERVER_WORKER_AMOUNT="$${API_WEBSOCKET_WORKER_AMOUNT:-1}"
        export SERVER_WORKER_CLASS="$${API_WEBSOCKET_WORKER_CLASS:-geventwebsocket.gunicorn.workers.GeventWebSocketWorker}"
        export SERVER_WORKER_CONNECTIONS="$${API_WEBSOCKET_WORKER_CONNECTIONS:-1000}"
        export GUNICORN_TIMEOUT="$${API_WEBSOCKET_GUNICORN_TIMEOUT:-360}"
        exec /bin/bash /entrypoint.sh
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
    volumes:
      # Mount the storage directory to the container, for storing user files.
      - ./docker/volumes/app/storage:/app/api/storage
    networks:
      - ssrf_proxy_network
      - default

  # The Celery worker for processing all queues (dataset, workflow, mail, etc.)
  worker:
    <<: *shared-worker-config
    image: langgenius/dify-api:1.19.0
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MODE: worker
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
      agent_backend:
        condition: service_started
    volumes:
      # Mount the storage directory to the container, for storing user files.
      - ./docker/volumes/app/storage:/app/api/storage
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_healthcheck.celery inspect ping"]
      interval: ${COMPOSE_WORKER_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${COMPOSE_WORKER_HEALTHCHECK_TIMEOUT:-30s}
      retries: 3
      start_period: 60s
      disable: ${COMPOSE_WORKER_HEALTHCHECK_DISABLED:-true}
    networks:
      - ssrf_proxy_network
      - default

  # Dedicated worker for click-time Dataset snapshots and KnowledgeFS upgrade orchestration.
  # Keep this queue out of the generic worker so large file copies cannot starve existing jobs.
  worker_beat:
    <<: *shared-worker-beat-config
    image: langgenius/dify-api:1.19.0
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MODE: beat
      INNER_API_KEY_FOR_PLUGIN: ${PLUGIN_DIFY_INNER_API_KEY:-}
    depends_on:
      init_permissions:
        condition: service_completed_successfully
      db_postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_healthcheck.celery inspect ping"]
      interval: ${COMPOSE_WORKER_HEALTHCHECK_INTERVAL:-30s}
      timeout: ${COMPOSE_WORKER_HEALTHCHECK_TIMEOUT:-30s}
      retries: 3
      start_period: 60s
      disable: ${COMPOSE_WORKER_HEALTHCHECK_DISABLED:-true}
    networks:
      - ssrf_proxy_network
      - default

  # Frontend web application.
  web:
    image: langgenius/dify-web:1.19.0
    restart: always
    environment:
      # Coolify replaces service env_file entries with its generated .env.
      # Set the browser-facing API URLs explicitly so Dify does not fall back
      # to its localhost development defaults.
      CONSOLE_API_URL: ${CONSOLE_API_URL:-https://dify.schrot47.asia}
      SERVER_CONSOLE_API_URL: ${SERVER_CONSOLE_API_URL:-http://api:5001}
      APP_API_URL: ${APP_API_URL:-https://dify.schrot47.asia}
    env_file:
      - path: ./docker/envs/core-services/web.env
        required: false
      - path: ./docker/envs/security.env
        required: false
      - ./.env
      - ./docker/envs/core-services/web.defaults

  # The PostgreSQL database.
  db_postgres:
    env_file:
      - path: ./docker/envs/databases/db-postgres.env
        required: false
      - ./docker/envs/databases/db-postgres.defaults
    image: postgres:15-alpine
    profiles:
      - postgresql
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-difyai123456}
      POSTGRES_DB: ${DB_DATABASE:-dify}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-128MB}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-4MB}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}
      POSTGRES_STATEMENT_TIMEOUT: ${POSTGRES_STATEMENT_TIMEOUT:-0}
      POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT: ${POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-0}
    # Expand service-file settings inside the container, preserving the image's initialization.
    command:
      - sh
      - -c
      - >-
        exec docker-entrypoint.sh postgres
        -c "max_connections=$$POSTGRES_MAX_CONNECTIONS"
        -c "shared_buffers=$$POSTGRES_SHARED_BUFFERS"
        -c "work_mem=$$POSTGRES_WORK_MEM"
        -c "maintenance_work_mem=$$POSTGRES_MAINTENANCE_WORK_MEM"
        -c "effective_cache_size=$$POSTGRES_EFFECTIVE_CACHE_SIZE"
        -c "statement_timeout=$$POSTGRES_STATEMENT_TIMEOUT"
        -c "idle_in_transaction_session_timeout=$$POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT"
    volumes:
      - ./docker/volumes/db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h db_postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 1s
      timeout: 3s
      retries: 60

  # The mysql database.
  redis:
    env_file:
      - path: ./docker/envs/databases/redis.env
        required: false
      - ./docker/envs/databases/redis.defaults
    image: redis:6-alpine
    restart: always
    volumes:
      # Mount the redis data directory to the container.
      - ./docker/volumes/redis/data:/data
    # Set the redis password when startup redis server.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli ping | grep -q PONG",
        ]

  # The DifySandbox
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: always
    env_file:
      - path: ./docker/envs/core-services/sandbox.env
        required: false
      - path: ./docker/envs/security.env
        required: false
      - ./.env
      - ./docker/envs/core-services/sandbox.defaults
    environment:
      SANDBOX_PORT: ${SANDBOX_PORT:-8194}
      API_KEY: ${CODE_EXECUTION_API_KEY:-}
      ENABLE_NETWORK: ${SANDBOX_ENABLE_NETWORK:-true}
      GIN_MODE: ${SANDBOX_GIN_MODE:-release}
      HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-http://ssrf_proxy:3128}
      HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-http://ssrf_proxy:3128}
      WORKER_TIMEOUT: ${SANDBOX_WORKER_TIMEOUT:-15}
    volumes:
      - ./docker/volumes/sandbox/dependencies:/dependencies
      - ./docker/volumes/sandbox/conf:/conf
    healthcheck:
      test: ["CMD-SHELL", 'curl -f "http://localhost:$$SANDBOX_PORT/health"']
    networks:
      - ssrf_proxy_network

  # Local sandbox for Dify Agent shell workspaces.
  # Network isolation: local_sandbox has NO direct route to `api`. Its only
  # networks are `agent_sandbox_network` (so agent_backend can reach it on 5004
  # for shellctl, and it can reach agent_backend directly) and
  # `local_sandbox_proxy_network` (so its egress is forced through
  # agent_ssrf_proxy).
  # All non-agent_backend/localhost traffic goes through the Squid forward proxy
  # on port 3128, which only allows agent_backend /agent-stub/ and the Dify API
  # /files/* endpoints (see ssrf_proxy/squid-agent.conf.template).
  local_sandbox:
    image: langgenius/dify-agent-local-sandbox:1.19.0
    command: ["shellctl", "serve", "--listen", "0.0.0.0:5004", "--require-auth-token"]
    restart: always
    env_file:
      - path: ./docker/envs/core-services/local-sandbox.env
        required: false
    environment:
      - SHELLCTL_AUTH_TOKEN=${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}
      - HTTP_PROXY=http://agent_ssrf_proxy:3128
      - HTTPS_PROXY=http://agent_ssrf_proxy:3128
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - dify_agent_local_sandbox_home:/home/dify
      - dify_agent_local_sandbox_workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agent_sandbox_network
      - local_sandbox_proxy_network

  # plugin daemon
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.14-local
    restart: always
    env_file:
      - path: ./docker/envs/core-services/shared.env
        required: false
      - path: ./docker/envs/core-services/api-worker.env
        required: false
      - path: ./docker/envs/core-services/plugin-daemon.env
        required: false
      - path: ./docker/envs/security.env
        required: false
      - path: ./docker/envs/databases/db-postgres.env
        required: false
      - path: ./docker/envs/databases/db-mysql.env
        required: false
      - path: ./docker/envs/databases/redis.env
        required: false
      - ./.env
      - ./docker/envs/core-services/api-worker.defaults
      - ./docker/envs/core-services/plugin-daemon.defaults
    networks:
      - ssrf_proxy_network
      - default
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DB_HOST: ${DB_HOST:-db_postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-difyai123456}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_PLUGIN_DATABASE:-dify_plugin}
      DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-}
      DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      SERVER_KEY: ${PLUGIN_DAEMON_KEY:-}
      SERVER_PORT: ${PLUGIN_DAEMON_PORT:-5002}
      PLUGIN_WORKING_PATH: ${PLUGIN_WORKING_PATH:-/app/storage/cwd}
      PLUGIN_STORAGE_LOCAL_ROOT: ${PLUGIN_STORAGE_LOCAL_ROOT:-/app/storage}
      PLUGIN_REMOTE_INSTALLING_PORT: ${PLUGIN_DEBUGGING_PORT:-5003}
      PLUGIN_REMOTE_INSTALLING_HOST: ${PLUGIN_DEBUGGING_HOST:-0.0.0.0}
    ports:
      - "${EXPOSE_PLUGIN_DEBUGGING_PORT:-5003}:${PLUGIN_DEBUGGING_PORT:-5003}"
    volumes:
      - ./docker/volumes/plugin_daemon:/app/storage
    depends_on:
      db_postgres:
        condition: service_healthy
        required: false
  agent_backend:
    image: langgenius/dify-agent-backend:1.19.0
    restart: always
    env_file:
      - path: ./docker/envs/security.env
        required: false
      - path: ./docker/envs/databases/redis.env
        required: false
      - path: ./docker/envs/core-services/dify-agent.env
        required: false
      - ./.env
      - ./docker/envs/core-services/dify-agent.defaults
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN: ${DIFY_AGENT_LOCAL_SANDBOX_AUTH_TOKEN:-${DIFY_AGENT_SHELLCTL_AUTH_TOKEN:-}}
      DIFY_AGENT_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
      DIFY_AGENT_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-}
      DIFY_AGENT_PLUGIN_DAEMON_URL: ${PLUGIN_DAEMON_URL:-http://plugin_daemon:5002}
      DIFY_AGENT_PLUGIN_DAEMON_API_KEY: ${PLUGIN_DAEMON_KEY:-}
    depends_on:
      redis:
        condition: service_started
      plugin_daemon:
        condition: service_started
    networks:
      - default
      # Shared internal network with local_sandbox so agent_backend can reach it
      # on port 5004 (shellctl entrypoint) while local_sandbox stays off `default`.
      - agent_sandbox_network

  # Dedicated SSRF proxy for the dify-agent local_sandbox.
  agent_ssrf_proxy:
    image: ubuntu/squid:latest
    restart: always
    volumes:
      - ./docker/ssrf_proxy/squid-agent.conf.template:/etc/squid/squid.conf.template
      - ./docker/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
      - ./docker/ssrf_proxy/docker-agent-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    env_file:
      - path: ./docker/envs/infrastructure/ssrf-proxy.env
        required: false
      - ./docker/envs/infrastructure/ssrf-proxy.defaults
    environment:
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
    networks:
      # Needs to reach api and agent_backend as forward-proxy destinations.
      - default
      # Only agent_ssrf_proxy and local_sandbox share this internal network, so
      # the local_sandbox can reach Squid without gaining a direct route to `api`.
      - local_sandbox_proxy_network

  # ssrf_proxy server
  # for more information, please refer to
  # https://docs.dify.ai/en/self-host/deploy/troubleshooting/docker-issues#why-is-ssrf-proxy-needed
  ssrf_proxy:
    env_file:
      - path: ./docker/envs/infrastructure/ssrf-proxy.env
        required: false
      - ./docker/envs/infrastructure/ssrf-proxy.defaults
    environment:
      COREDUMP_DIR: ${SSRF_COREDUMP_DIR:-/var/spool/squid}
      HTTP_PORT: ${SSRF_HTTP_PORT:-3128}
    image: ubuntu/squid:latest
    restart: always
    volumes:
      - ./docker/ssrf_proxy/squid.conf.template:/etc/squid/squid.conf.template
      - ./docker/ssrf_proxy/squid-common.conf.template:/etc/squid/dify_common.conf.template
      - ./docker/ssrf_proxy/docker-entrypoint.sh:/docker-entrypoint-mount.sh
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    networks:
      - ssrf_proxy_network
      - default

  # Certbot service
  # use `docker-compose --profile certbot up` to start the certbot service.
  nginx:
    env_file:
      - path: ./docker/envs/infrastructure/nginx.env
        required: false
      - ./docker/envs/infrastructure/nginx.defaults
    image: nginx:latest
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./docker/nginx/proxy.conf.template:/etc/nginx/proxy.conf.template
      - ./docker/nginx/https.conf.template:/etc/nginx/https.conf.template
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/docker-entrypoint.sh:/docker-entrypoint-mount.sh
      - ./docker/nginx/ssl:/etc/ssl # cert dir (legacy)
      - ./docker/volumes/certbot/conf/live:/etc/letsencrypt/live # cert dir (with certbot container)
      - ./docker/volumes/certbot/conf:/etc/letsencrypt
      - ./docker/volumes/certbot/www:/var/www/html
    entrypoint:
      [
        "sh",
        "-c",
        "cp /docker-entrypoint-mount.sh /docker-entrypoint.sh && sed -i 's/\r$$//' /docker-entrypoint.sh && chmod +x /docker-entrypoint.sh && /docker-entrypoint.sh",
      ]
    environment:
      NGINX_SSL_PORT: ${NGINX_SSL_PORT:-443}
      NGINX_PORT: ${NGINX_PORT:-80}
      NGINX_WORKER_PROCESSES: ${NGINX_WORKER_PROCESSES:-auto}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
      NGINX_KEEPALIVE_TIMEOUT: ${NGINX_KEEPALIVE_TIMEOUT:-65}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-3600s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-3600s}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_HTTPS_ENABLED: ${NGINX_HTTPS_ENABLED:-false}
      NGINX_SSL_CERT_FILENAME: ${NGINX_SSL_CERT_FILENAME:-dify.crt}
      NGINX_SSL_CERT_KEY_FILENAME: ${NGINX_SSL_CERT_KEY_FILENAME:-dify.key}
      NGINX_SSL_PROTOCOLS: ${NGINX_SSL_PROTOCOLS:-TLSv1.2 TLSv1.3}
      NGINX_ENABLE_CERTBOT_CHALLENGE: ${NGINX_ENABLE_CERTBOT_CHALLENGE:-false}
      NGINX_SOCKET_IO_UPSTREAM: ${NGINX_SOCKET_IO_UPSTREAM:-api_websocket:5001}
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:-}
    depends_on:
      - api
      - web
    ports:
      - "${EXPOSE_NGINX_PORT:-80}:${NGINX_PORT:-80}"
      - "${EXPOSE_NGINX_SSL_PORT:-443}:${NGINX_SSL_PORT:-443}"

  # The Weaviate vector store.
  weaviate:
    env_file:
      - path: ./docker/envs/vectorstores/weaviate.env
        required: false
      - ./docker/envs/vectorstores/weaviate.defaults
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.13
    profiles:
      - weaviate
    restart: always
    volumes:
      # Mount the Weaviate data directory to the con tainer.
      - ./docker/volumes/weaviate:/var/lib/weaviate
  # OceanBase vector database
networks:
  # create a network between sandbox, api and ssrf_proxy, and can not access outside.
  ssrf_proxy_network:
    driver: bridge
    internal: true
  # Internal network shared only by agent_ssrf_proxy and local_sandbox.
  local_sandbox_proxy_network:
    driver: bridge
    internal: true
  # shellctl control channel (agent_backend -> local_sandbox:5004).
  # sandbox can access agent backend through this network, this is
  # a known limitation.
  #
  # The agent runtime respects HTTP(S)_PROXY, but arbitrary code execution
  # is still possible through the shellctl channel.
  agent_sandbox_network:
    driver: bridge
    internal: true
  milvus:
    driver: bridge
  opensearch-net:
    driver: bridge
    internal: true

volumes:
  oradata:
  dify_es01_data:
  dify_agent_local_sandbox_home:
  dify_agent_local_sandbox_workspace:
