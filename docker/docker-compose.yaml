# KNOWLEDGE_FS_WORKER_IMAGE must bundle the KnowledgeFS engine at KNOWLEDGE_FS_BACKGROUND_ENGINE_PATH;
# standard Dify API images do not, and the worker entrypoint exits without it.
x-knowledge-fs-celery-worker: &knowledge-fs-celery-worker
  image: ${KNOWLEDGE_FS_WORKER_IMAGE:-langgenius/dify-api:1.19.0}
  profiles:
    - knowledge-fs-celery
  restart: always
  # Match the two-hour default task deadline plus shutdown margin for long document jobs.
  stop_grace_period: 125m
  env_file:
    - path: ./docker/envs/core-services/shared.env
      required: false
    - path: ./docker/envs/core-services/api-worker.env
      required: false
    - path: ./docker/envs/security.env
      required: false
    - path: ./docker/envs/databases/db-postgres.env
      required: false
    - path: ./docker/envs/databases/db-mysql.env
      required: false
    - path: ./docker/envs/databases/redis.env
      required: false
    - path: ./docker/envs/core-services/knowledge-fs.env
      required: false
    - path: ./docker/envs/core-services/knowledge-fs-worker.env
      required: false
    - path: ./docker/envs/core-services/worker.env
      required: false
    - ./.env
    - ./docker/envs/core-services/api-worker.defaults
    - ./docker/envs/core-services/worker.defaults
  environment: &knowledge-fs-celery-environment
    MODE: worker
    MIGRATION_ENABLED: "false"
    CELERY_WORKER_POOL: prefork
    CELERY_PREFETCH_MULTIPLIER: "1"
    # Periodic database sweeps are cheap Celery tasks; the standard 50-task recycling would
    # repeatedly discard a warm engine even while idle.
    MAX_TASKS_PER_CHILD: ${KNOWLEDGE_FS_WORKER_MAX_TASKS_PER_CHILD:-1000}
    DIFY_INNER_API_URL: ${PLUGIN_DIFY_INNER_API_URL:-http://api:5001}
    DIFY_INNER_API_KEY: ${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
    KNOWLEDGE_INTEGRATED_MODE_ENABLED: ${KNOWLEDGE_INTEGRATED_MODE_ENABLED:-true}
    KNOWLEDGE_DIRECT_UPLOAD_ENABLED: ${KNOWLEDGE_DIRECT_UPLOAD_ENABLED:-true}
  depends_on:
    api:
      condition: service_healthy
  networks:
    - default

